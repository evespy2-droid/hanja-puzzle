        fill="#5F5C54" opacity="0.14"/>

  <!-- 굵은 붓질 2 (반대 대각선, 아래쪽) -->
  <g opacity="0.5">
    <path d="M40,980 C260,900 420,1120 660,1040 C860,975 930,1180 1170,1100"
