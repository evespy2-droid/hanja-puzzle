    <circle cx="1175" cy="1120" r="4" opacity="0.3"/>
    <circle cx="1190" cy="1075" r="3" opacity="0.28"/>
    <circle cx="65" cy="960" r="5" opacity="0.32"/>
    <circle cx="90" cy="995" r="3" opacity="0.28"/>
  </g>

  <path d="M760,1200 C860,1165 900,1260 1020,1225 C1090,1204 1060,1290 1160,1260"
        stroke="#1C1A16" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.22"/>
  <path d="M120,1300 C230,1265 265,1360 390,1325"
        stroke="#1C1A16" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.2"/>

  <!-- 인장 (먹으로 찍은 낙관) -->
  <g opacity="0.4">
    <rect x="1108" y="1350" width="46" height="46" rx="4" fill="#201E1B"/>
    <text x="1131" y="1380" font-family="'Nanum Myeongjo',serif" font-size="22" font-weight="800"
          fill="#F7F6F2" text-anchor="middle">印</text>
  </g>
  <g opacity="0.3">
    <rect x="46" y="418" width="34" height="34" rx="3" fill="#201E1B" transform="rotate(-8 63 435)"/>
    <text x="63" y="441" font-family="'Nanum Myeongjo',serif" font-size="16" font-weight="800"
          fill="#F7F6F2" text-anchor="middle" transform="rotate(-8 63 435)">畵</text>
  </g>

  <!-- 대나무 -->
  <g opacity="0.24" stroke="#1C1A16" fill="none" stroke-linecap="round">
    <path d="M75,1800 C68,1670 96,1580 78,1470 C70,1400 92,1355 82,1290" stroke-width="10"/>
    <path d="M120,1800 C117,1650 142,1560 128,1440 C121,1360 140,1315 132,1250" stroke-width="10"/>
    <path d="M165,1800 C162,1690 186,1590 174,1490 C168,1435 183,1390 176,1335" stroke-width="10"/>
