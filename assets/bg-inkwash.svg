    <path d="M176,1375 L130,1348 M176,1375 L226,1352" stroke-width="8"/>
    <path d="M85,1310 L45,1285 M85,1310 L124,1288" stroke-width="7"/>
  </g>

  <!-- 하단 근경 언덕 -->
  <path d="M0,1800 L0,1690 C110,1645 210,1690 310,1640 C410,1590 490,1660 590,1615
           C690,1570 770,1640 870,1595 C970,1555 1050,1620 1150,1580
