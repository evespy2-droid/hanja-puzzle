    <path d="M40,995 C260,918 420,1132 660,1055 C860,992 930,1192 1170,1115"
          stroke="#1C1A16" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.3"/>
  </g>
  <g fill="#1C1A16">
