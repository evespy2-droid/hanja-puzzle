<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" preserveAspectRatio="none">
  <defs>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.11
                0 0 0 0 0.10
                0 0 0 0 0.08
                0 0 0 0.05 0"/>
    </filter>
  </defs>

  <!-- 종이 결 (은은한 그레인) -->
  <rect x="0" y="0" width="1200" height="1800" filter="url(#grain)"/>

  <!-- 은은한 달 -->
  <circle cx="1010" cy="120" r="130" fill="url(#moon)"/>

  <!-- 먼 산 -->
  <path d="M0,360 L0,300 C70,270 130,240 210,265 C290,290 330,205 410,230
           C490,255 545,300 625,270 C705,240 765,195 845,240
           C925,285 985,245 1065,275 C1130,300 1170,285 1200,305 L1200,360 Z"
        fill="#9C9990" opacity="0.22"/>

  <!-- 중간 산 -->
  <path d="M0,480 L0,410 C60,375 125,355 205,388 C285,421 325,335 405,368
           C485,401 525,450 605,418 C685,386 745,335 825,378
           C905,421 965,388 1045,421 C1105,444 1165,430 1200,452 L1200,480 Z"
        fill="#7D7A70" opacity="0.2"/>

  <!-- 굵은 붓질 (기운찬 사선, 갈필 텍스처) -->
  <g opacity="0.5">
    <path d="M-40,470 C160,410 320,610 560,540 C760,485 820,690 1060,620"
          stroke="#1C1A16" stroke-width="34" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M-40,485 C160,428 320,622 560,555 C760,502 820,702 1060,635"
          stroke="#1C1A16" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.35"/>
    <path d="M20,445 C200,405 300,530 480,500" stroke="#1C1A16" stroke-width="4" fill="none"
          stroke-linecap="round" opacity="0.3" stroke-dasharray="2 10"/>
  </g>

  <!-- 먹 튀김 (스플래터) -->
  <g fill="#1C1A16">
    <circle cx="1085" cy="605" r="7" opacity="0.4"/>
    <circle cx="1105" cy="640" r="4" opacity="0.35"/>
    <circle cx="1120" cy="595" r="3" opacity="0.3"/>
    <circle cx="1070" cy="650" r="2.5" opacity="0.3"/>
    <circle cx="60" cy="460" r="5" opacity="0.35"/>
    <circle cx="40" cy="495" r="3" opacity="0.3"/>
    <circle cx="540" cy="525" r="4" opacity="0.3"/>
    <circle cx="565" cy="560" r="2.5" opacity="0.28"/>
  </g>

  <!-- 매화 가지 -->
  <g opacity="0.22" stroke="#3A3730" fill="none" stroke-linecap="round">
    <path d="M980,560 C960,620 1000,660 970,730 C950,775 990,810 965,870" stroke-width="5"/>
    <path d="M975,600 C1000,585 1030,595 1050,575" stroke-width="4"/>
    <path d="M968,690 C945,675 915,680 895,660" stroke-width="4"/>
    <path d="M968,760 C995,748 1020,755 1045,740" stroke-width="4"/>
  </g>
  <g opacity="0.22" fill="#2A2823">
    <circle cx="1048" cy="573" r="7"/>
    <circle cx="1028" cy="585" r="6"/>
    <circle cx="893" cy="658" r="6"/>
    <circle cx="913" cy="678" r="5"/>
    <circle cx="1043" cy="738" r="6"/>
    <circle cx="1022" cy="752" r="5"/>
